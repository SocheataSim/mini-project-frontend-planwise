<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tasks | Planwise</title>
    <meta name="description" content="Plan, prioritise and finish your study tasks with Planwise." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F3F5FA" />
    <meta property="og:title" content="Tasks | Planwise" />
    <meta property="og:description" content="Plan, prioritise and finish your study tasks with Planwise." />
    <meta property="og:type" content="website" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("planwise-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/planwise-logo.png" type="image/svg+xml" />
    <link rel="stylesheet" href="../style/output.css" />
    <script type="module" src="../dist/index.js" defer></script>
  </head>

  <body class="bg-page font-sans text-ink" data-page="task">
    <noscript><p class="m-4 rounded-xl bg-brand-soft p-4 text-brand">Planwise needs JavaScript to run. Please turn it on in your browser.</p></noscript>
    <a
      href="#main"
      class="sr-only rounded-lg bg-brand px-4 py-2 text-on-brand focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50"
      >Skip to content</a
    >

    <aside class="fixed inset-y-0 left-0 z-30 hidden w-[4.5rem] flex-col bg-page px-3 py-6 md:flex lg:w-56 lg:px-5">
      <a href="../index.html" class="flex items-center justify-center gap-2.5 lg:justify-start lg:px-2" aria-label="Planwise home">
        <img src="../assets/planwise-logo.png" alt="" width="48" height="48" class="size-10 shrink-0 lg:size-11" />
        <span class="hidden font-display text-lg font-extrabold tracking-tight text-navy lg:inline">Planwise</span>
      </a>

      <nav id="sidebar-nav" aria-label="Main" class="mt-10 flex flex-col gap-2"></nav>

      <div class="mt-8 hidden rounded-2xl bg-navy-soft p-4 lg:block">
        <svg viewBox="0 0 24 24" class="size-6 text-navy" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21v-9" /><path d="M12 12c0-3 2-5 5-5 0 3-2 5-5 5z" /><path d="M12 14c0-2.5-1.8-4-4.5-4 0 2.5 1.8 4 4.5 4z" /><path d="M8 21h8" />
        </svg>
        <p class="mt-3 text-base font-bold leading-snug text-ink">Small steps. Bright futures.</p>
        <p class="mt-3 text-sm text-ink/80">Make a little room for learning every day.</p>
      </div>
    </aside>

    <!-- Page area -->
    <div class="min-h-screen md:pl-[4.5rem] lg:pl-56">
      <div class="min-h-screen bg-surface px-4 pb-28 pt-5 sm:px-6 md:rounded-tl-[2.5rem] md:px-8 md:pb-10 md:pt-6 lg:px-10">
        <header class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <a href="../index.html" class="md:hidden" aria-label="Planwise home">
              <img src="../assets/logo-elements.png" alt="Planwise" width="40" height="40" class="size-10" />
            </a>
            <div>
              <p class="text-xs text-muted">My workspace</p>
              <p class="text-base font-semibold">Task</p>
            </div>
          </div>

          <div class="flex items-center gap-1 sm:gap-2">
            <time id="today" class="mr-2 hidden text-base text-muted sm:block"></time>

            <button type="button" class="grid size-10 place-items-center rounded-full text-muted transition-colors hover:bg-elevated hover:text-ink" aria-label="Search">
              <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            </button>

            <button type="button" class="grid size-10 place-items-center rounded-full text-muted transition-colors hover:bg-elevated hover:text-ink" aria-label="Notifications">
              <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z" /><path d="M10 19a2 2 0 0 0 4 0" /></svg>
            </button>

            <!-- Light / dark toggle -->
            <button type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode" class="grid size-10 place-items-center rounded-full text-muted transition-colors hover:bg-elevated hover:text-ink">
              <svg viewBox="0 0 24 24" class="size-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
              <svg viewBox="0 0 24 24" class="hidden size-5 dark:block" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            </button>

            <button type="button" class="grid size-10 place-items-center rounded-full bg-navy-soft text-sm font-bold text-navy" aria-label="Open profile"><span id="user-initials">AK</span></button>
          </div>
        </header>

        <main id="main" class="mt-6">
          <div id="task-content"></div>

          <!-- New task dialog -->
          <dialog id="task-dialog" aria-labelledby="task-dialog-title" class="m-auto max-h-[calc(100dvh-2rem)] w-[min(34rem,calc(100vw-2rem))] overflow-y-auto rounded-3xl bg-elevated p-0 text-ink shadow-[var(--shadow-md)] backdrop:bg-black/50 backdrop:backdrop-blur-sm">
            <form id="task-form" novalidate class="p-6 sm:p-8">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <h2 id="task-dialog-title" class="font-display text-xl font-extrabold tracking-tight">Make a little plan.</h2>
                  <p class="mt-2 text-sm text-muted">Create a task and give your next step a home.</p>
                </div>
                <button type="button" data-close aria-label="Close" class="grid size-9 shrink-0 place-items-center rounded-full text-muted transition-colors hover:bg-surface hover:text-ink"><svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
              </div>

              <div class="mt-6 space-y-5">
                <div>
                  <label for="task-title" class="mb-2 block text-sm font-semibold">Task title</label>
                  <input id="task-title" name="title" type="text" required maxlength="100" placeholder="Memory &amp; cognition essay" class="h-12 w-full rounded-xl bg-surface px-4 text-base outline-none transition placeholder:text-muted/70 focus:ring-2 focus:ring-brand" />
                </div>
                <div>
                  <label for="task-course" class="mb-2 block text-sm font-semibold">Course</label>
                  <div class="relative">
                    <select id="task-course" name="courseId" class="h-12 w-full rounded-xl bg-surface px-4 text-base outline-none transition placeholder:text-muted/70 focus:ring-2 focus:ring-brand appearance-none pr-10"></select>
                    <span class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-muted"><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
                  </div>
                </div>
                <div class="grid gap-5 sm:grid-cols-2">
                  <div><label for="task-date" class="mb-2 block text-sm font-semibold">Due date</label><input id="task-date" name="date" type="date" required class="h-12 w-full rounded-xl bg-surface px-4 text-base outline-none transition placeholder:text-muted/70 focus:ring-2 focus:ring-brand" /></div>
                  <div><label for="task-time" class="mb-2 block text-sm font-semibold">Due time</label><input id="task-time" name="time" type="time" class="h-12 w-full rounded-xl bg-surface px-4 text-base outline-none transition placeholder:text-muted/70 focus:ring-2 focus:ring-brand" /></div>
                </div>
                <fieldset>
                  <legend class="mb-2 block text-sm font-semibold">Priority</legend>
                  <div class="flex flex-wrap gap-2">
                    <label class="cursor-pointer">
                  <input type="radio" name="priority" value="high" checked class="peer sr-only" />
                  <span class="inline-flex rounded-full bg-surface px-4 py-2 text-sm font-semibold text-muted transition-colors peer-checked:bg-brand-soft peer-checked:text-brand peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-brand">High</span>
                </label>
                    <label class="cursor-pointer">
                  <input type="radio" name="priority" value="medium"  class="peer sr-only" />
                  <span class="inline-flex rounded-full bg-surface px-4 py-2 text-sm font-semibold text-muted transition-colors peer-checked:bg-navy-soft peer-checked:text-navy peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-brand">Medium</span>
                </label>
                    <label class="cursor-pointer">
                  <input type="radio" name="priority" value="low"  class="peer sr-only" />
                  <span class="inline-flex rounded-full bg-surface px-4 py-2 text-sm font-semibold text-muted transition-colors peer-checked:bg-mint-soft peer-checked:text-mint peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-brand">Low</span>
                </label>
                  </div>
                </fieldset>
                <div>
                  <label for="task-notes" class="mb-2 block text-sm font-semibold">Notes</label>
                  <textarea id="task-notes" name="notes" rows="3" maxlength="300" placeholder="Compare working memory and long-term memory. Include two research examples." class="h-12 w-full rounded-xl bg-surface px-4 text-base outline-none transition placeholder:text-muted/70 focus:ring-2 focus:ring-brand h-auto py-3"></textarea>
                </div>
                <label class="flex items-center gap-3 text-sm text-muted">
                  <input type="checkbox" name="remind" checked class="size-5 rounded accent-brand" />
                  Remind me 30 minutes before
                </label>
              </div>

              <div class="mt-8 flex justify-end gap-3 border-t border-line pt-6">
                <button type="button" data-close class="rounded-xl border border-line bg-elevated px-5 py-3 text-sm font-semibold transition-colors hover:bg-surface">Cancel</button>
                <button type="submit" class="inline-flex items-center gap-2 rounded-xl bg-brand px-5 py-3 text-sm font-semibold text-on-brand transition hover:brightness-95"><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Create task</button>
              </div>
            </form>
          </dialog>

          <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message" class="m-auto w-[min(26rem,calc(100vw-2rem))] rounded-3xl bg-elevated p-0 text-ink shadow-[var(--shadow-md)] backdrop:bg-black/50 backdrop:backdrop-blur-sm">
            <div class="p-6 sm:p-8">
              <div class="grid size-12 place-items-center rounded-full bg-brand-soft text-brand">
                <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
              </div>
              <h2 id="confirm-title" class="mt-4 font-display text-lg font-extrabold tracking-tight"></h2>
              <p id="confirm-message" class="mt-2 text-sm text-muted"></p>
              <div class="mt-8 flex justify-end gap-3">
                <button type="button" data-confirm-cancel autofocus class="rounded-xl border border-line bg-elevated px-5 py-3 text-sm font-semibold transition-colors hover:bg-surface">Cancel</button>
                <button type="button" data-confirm-ok id="confirm-ok" class="rounded-xl bg-brand px-5 py-3 text-sm font-semibold text-on-brand transition hover:brightness-95">Delete</button>
              </div>
            </div>
          </dialog>
        </main>
      </div>
    </div>

    <nav id="bottom-nav" aria-label="Main" class="fixed inset-x-0 bottom-0 z-30 grid grid-cols-4 border-t border-line bg-elevated pb-[env(safe-area-inset-bottom)] md:hidden"></nav>
  </body>
</html>
